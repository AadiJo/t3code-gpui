[package]
name = "t3code-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# GPUI headless renderer and input helpers, for scripted screenshots.
test-support = ["gpui-kit/test-support"]

[dependencies]
t3code-client-runtime.workspace = true
t3code-contracts.workspace = true
t3code-i18n-macros.workspace = true
t3code-shared.workspace = true
alacritty_terminal.workspace = true
anyhow.workspace = true
fancy-regex.workspace = true
flate2.workspace = true
futures.workspace = true
gpui-kit.workspace = true
image.workspace = true
jiff.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
thiserror.workspace = true
unicode-properties.workspace = true
smallvec.workspace = true
syntect.workspace = true
unicode-segmentation.workspace = true
markdown.workspace = true
resvg.workspace = true
rodio.workspace = true
two-face.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Clicks through the languages in the `i18n` scene headlessly and screenshots each.
[[example]]
name = "i18n_switch"
required-features = ["test-support"]
