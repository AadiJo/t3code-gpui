[package]
name = "t3code-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# GPUI headless renderer and input helpers, for scripted screenshots.
test-support = ["gpui-kit/test-support"]

[dependencies]
t3code-client-runtime.workspace = true
t3code-contracts.workspace = true
t3code-i18n-macros.workspace = true
t3code-shared.workspace = true
alacritty_terminal.workspace = true
anyhow.workspace = true
fancy-regex.workspace = true
flate2.workspace = true
futures.workspace = true
gpui-kit.workspace = true
image.workspace = true
jiff.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
thiserror.workspace = true
unicode-properties.workspace = true
smallvec.workspace = true
syntect.workspace = true
unicode-segmentation.workspace = true
markdown.workspace = true
resvg.workspace = true
rodio.workspace = true
two-face.workspace = true
regex.workspace = true
unicode-width.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
t3code-i18n-macros.workspace = true
flate2.workspace = true
jiff.workspace = true
sys-locale.workspace = true
unicode-properties.workspace = true

# Clicks through the languages in the `i18n` scene headlessly and screenshots each.
[[example]]
name = "i18n_switch"
required-features = ["test-support"]

# Headless end-to-end checks and measurements for the diff panel.
[[example]]
name = "diffs_harness"
required-features = ["test-support"]

# Drives keyboard control and the command palette headlessly; writes a transcript, screenshots and timings.
[[example]]
name = "palette_check"
required-features = ["test-support"]

# Clicks through the git actions, branch picker, dialogs and menus headlessly and screenshots each step.
[[example]]
name = "git_actions_check"
required-features = ["test-support"]

# Runs the ported pull request and issue logic over the TypeScript runner's cases.
[[example]]
name = "pull_request_logic"

# Clicks through the pull request and issue surfaces and measures list filtering and the Code tab.
[[example]]
name = "pull_requests_check"
required-features = ["test-support"]
