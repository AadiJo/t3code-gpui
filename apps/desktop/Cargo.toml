[package]
name = "t3code-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
headless = ["t3code-web/test-support", "gpui-kit/test-support"]

[[bin]]
name = "t3code"
path = "src/main.rs"

# Renders the app with no display server and writes a PNG. Usage: shot <out.png>
[[bin]]
name = "shot"
path = "src/shot.rs"
required-features = ["headless"]

# Drives the terminal against a local PTY and benchmarks it. Usage: terminal-check <pty|bench> <out-dir>
[[bin]]
name = "terminal-check"
path = "src/terminal_check.rs"
required-features = ["headless"]

[dependencies]
t3code-client-runtime.workspace = true
t3code-web.workspace = true
anyhow.workspace = true
dirs.workspace = true
gpui-kit.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true

# Scripted end-to-end checks of the app shell: screenshots with hover, click,
# menus and resize, pixel samples, row metrics and frame times.
# Usage: shell_check <out-dir>
[[bin]]
name = "shell_check"
path = "src/shell_check.rs"
required-features = ["headless"]

# Composer typing latency and scripted interaction checks. Usage: composer-bench <out-dir>
[[bin]]
name = "composer-bench"
path = "src/composer_bench.rs"
required-features = ["headless"]

# Scripted chat screenshots and timeline measurements. Usage: chat-bench <shots|perf> <out-dir>
[[bin]]
name = "chat-bench"
path = "src/chat_bench.rs"
required-features = ["headless"]

# Files tab: scripted checks (tree, viewers, edit and save, search, go to file,
# media) and measurements (typing, tree scroll, memory). Usage: files-check <out-dir> [checks|perf|all]
[[bin]]
name = "files-check"
path = "src/files_check.rs"
required-features = ["headless"]
