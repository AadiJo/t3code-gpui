[package]
name = "t3code-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
headless = ["t3code-web/test-support", "gpui-kit/test-support"]

[[bin]]
name = "t3code"
path = "src/main.rs"

# Renders the app with no display server and writes a PNG. Usage: shot <out.png>
[[bin]]
name = "shot"
path = "src/shot.rs"
required-features = ["headless"]

# Drives the terminal against a local PTY and benchmarks it. Usage: terminal-check <pty|bench> <out-dir>
[[bin]]
name = "terminal-check"
path = "src/terminal_check.rs"
required-features = ["headless"]

# Pairs with a real server through the Environments UI, then reconnects,
# disables and removes it in a second run. Usage: connections-check <out> <data> <pair|restart>
[[bin]]
name = "connections-check"
path = "src/settings/connections_check.rs"
required-features = ["headless"]

# Imports made-up Electron catalogs encrypted with the Windows and macOS
# safeStorage schemes. Usage: import-check <out-dir>
[[bin]]
name = "import-check"
path = "src/import/import_check.rs"

[dependencies]
t3code-client-runtime.workspace = true
t3code-web.workspace = true
anyhow.workspace = true
dirs.workspace = true
gpui-kit.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
tokio.workspace = true
t3code-contracts.workspace = true
futures.workspace = true
jiff.workspace = true

# Scripted end-to-end checks of the app shell: screenshots with hover, click,
# menus and resize, pixel samples, row metrics and frame times.
# Usage: shell_check <out-dir>
[[bin]]
name = "shell_check"
path = "src/shell_check.rs"
required-features = ["headless"]

# Composer typing latency and scripted interaction checks. Usage: composer-bench <out-dir>
[[bin]]
name = "composer-bench"
path = "src/composer_bench.rs"
required-features = ["headless"]

# Scripted chat screenshots and timeline measurements. Usage: chat-bench <shots|perf> <out-dir>
[[bin]]
name = "chat-bench"
path = "src/chat_bench.rs"
required-features = ["headless"]

# Drives the assembled app headlessly: threads, sending, panels, history,
# relaunch restore, and the 5,000-thread navigation bench.
# Usage: app-check <session|restore> <out> <state-dir> <dark|light> | app-check bench <out>
[[bin]]
name = "parity-shot"
path = "src/parity_shot.rs"
required-features = ["headless"]

[[bin]]
name = "app-check"
path = "src/app_check.rs"
required-features = ["headless"]
# Runs a scripted notification sequence through the engine and inbox and logs
# every decision. Usage: notification-check <fixture.json> <out.jsonl> <darwin|linux> [--notify]
[[bin]]
name = "notification-check"
path = "src/notification_check.rs"

# Native notifications and the app icon badge (`src/notifications`).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSError", "NSObject", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSResponder"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotification", "UNNotificationRequest", "UNNotificationContent", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Files tab: scripted checks (tree, viewers, edit and save, search, go to file,
# media) and measurements (typing, tree scroll, memory). Usage: files-check <out-dir> [checks|perf|all]
[[bin]]
name = "files-check"
path = "src/files_check.rs"
required-features = ["headless"]
