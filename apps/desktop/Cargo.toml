[package]
name = "t3code-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
headless = ["t3code-web/test-support", "gpui-kit/test-support"]

[[bin]]
name = "t3code"
path = "src/main.rs"

# Renders the app with no display server and writes a PNG. Usage: shot <out.png>
[[bin]]
name = "shot"
path = "src/shot.rs"
required-features = ["headless"]

# Drives the terminal against a local PTY and benchmarks it. Usage: terminal-check <pty|bench> <out-dir>
[[bin]]
name = "terminal-check"
path = "src/terminal_check.rs"
required-features = ["headless"]

# Runs a scripted notification sequence through the engine and inbox and logs
# every decision. Usage: notification-check <fixture.json> <out.jsonl> <darwin|linux> [--notify]
[[bin]]
name = "notification-check"
path = "src/notification_check.rs"

[dependencies]
t3code-client-runtime.workspace = true
t3code-contracts.workspace = true
t3code-web.workspace = true
anyhow.workspace = true
dirs.workspace = true
futures.workspace = true
jiff.workspace = true
gpui-kit.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true

# Native notifications and the app icon badge (`src/notifications`).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSSet", "NSError", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSResponder"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotification", "UNNotificationRequest", "UNNotificationContent", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"

# Scripted end-to-end checks of the app shell: screenshots with hover, click,
# menus and resize, pixel samples, row metrics and frame times.
# Usage: shell_check <out-dir>
[[bin]]
name = "shell_check"
path = "src/shell_check.rs"
required-features = ["headless"]

# Composer typing latency and scripted interaction checks. Usage: composer-bench <out-dir>
[[bin]]
name = "composer-bench"
path = "src/composer_bench.rs"
required-features = ["headless"]

# Scripted chat screenshots and timeline measurements. Usage: chat-bench <shots|perf> <out-dir>
[[bin]]
name = "chat-bench"
path = "src/chat_bench.rs"
required-features = ["headless"]
