[package]
name = "t3code-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
headless = ["t3code-web/test-support", "gpui-kit/test-support"]
# Sampled heap profiles of `live-check` (`T3_HEAP_PROFILE`, see `live_check_heap.rs`).
heap-profile = ["dep:backtrace"]

[[bin]]
name = "t3code"
path = "src/main.rs"

# Renders the app with no display server and writes a PNG. Usage: shot <out.png>
[[bin]]
name = "shot"
path = "src/shot.rs"
required-features = ["headless"]

# Drives the terminal against a local PTY and benchmarks it. Usage: terminal-check <pty|bench> <out-dir>
[[bin]]
name = "terminal-check"
path = "src/terminal_check.rs"
required-features = ["headless"]

# Pairs with a real server through the Environments UI, then reconnects,
# disables and removes it in a second run. Usage: connections-check <out> <data> <pair|restart>
[[bin]]
name = "connections-check"
path = "src/settings/connections_check.rs"
required-features = ["headless"]

# T3 Connect end to end against a stand-in relay and Clerk in front of a real
# server. Usage: relay-check <connect|approval> <out-dir> <data-dir>
[[bin]]
name = "relay-check"
path = "src/relay_check.rs"
required-features = ["headless"]

# Every connection state for real against an isolated server, and route choice.
# Usage: states-check <states|routing|offline> <out-dir> <data-dir>
[[bin]]
name = "states-check"
path = "src/states_check.rs"
required-features = ["headless"]

# The first-launch import as the app runs it, a second launch, and a denied key read,
# against a stand-in install. Usage: launch-check <first|second|denied> <out> <data>
[[bin]]
name = "launch-check"
path = "src/launch_check.rs"
required-features = ["headless"]

# Imports made-up Electron catalogs encrypted with the Windows and macOS
# safeStorage schemes, and runs the first-launch file import over a stand-in
# install built around copied owner files. Usage: import-check <out-dir> [owner-dir]
[[bin]]
name = "import-check"
path = "src/import/import_check.rs"

# Runs the theme importers over fixture files for comparison with the
# TypeScript originals. Usage: theme-import-check <vscode|openvsx> <in> <out>
[[bin]]
name = "theme-import-check"
path = "src/settings/theme_import_check.rs"

# Changes each wired setting headlessly and screenshots its view, imports a
# fixture Electron settings file, records a keybinding, then checks a
# relaunch. Usage: settings-check <out-dir> <data-dir> <run|relaunch>
[[bin]]
name = "settings-check"
path = "src/settings/settings_check.rs"
required-features = ["headless"]

[dependencies]
t3code-client-runtime.workspace = true
t3code-web.workspace = true
t3code-shared.workspace = true
t3code-contracts.workspace = true
anyhow.workspace = true
dirs.workspace = true
gpui-kit.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
tokio.workspace = true
futures.workspace = true
jiff.workspace = true
url.workspace = true
uuid.workspace = true
rusty-leveldb.workspace = true
backtrace = { workspace = true, optional = true }

[build-dependencies]
embed-resource.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

# Scripted end-to-end checks of the app shell: screenshots with hover, click,
# menus and resize, pixel samples, row metrics and frame times.
# Usage: shell_check <out-dir>
[[bin]]
name = "shell_check"
path = "src/shell_check.rs"
required-features = ["headless"]

# Composer typing latency and scripted interaction checks. Usage: composer-bench <out-dir>
[[bin]]
name = "composer-bench"
path = "src/composer_bench.rs"
required-features = ["headless"]

# Scripted chat screenshots and timeline measurements. Usage: chat-bench <shots|perf> <out-dir>
[[bin]]
name = "chat-bench"
path = "src/chat_bench.rs"
required-features = ["headless"]

# Drives the assembled app headlessly: threads, sending, panels, history,
# relaunch restore, and the 5,000-thread navigation bench.
# Usage: app-check <session|restore> <out> <state-dir> <dark|light> | app-check bench <out>
[[bin]]
name = "parity-shot"
path = "src/parity_shot.rs"
required-features = ["headless"]

[[bin]]
name = "app-check"
path = "src/app_check.rs"
required-features = ["headless"]

# Drives panel, toast and popup transitions and checks the window stops
# asking for frames once each ends. Usage: motion-check <out-dir>
[[bin]]
name = "motion-check"
path = "src/motion_check.rs"
required-features = ["headless"]
# Runs a scripted notification sequence through the engine and inbox and logs
# every decision. Usage: notification-check <fixture.json> <out.jsonl> <darwin|linux> [--notify]
[[bin]]
name = "notification-check"
path = "src/notification_check.rs"

# Native notifications and the app icon badge (`src/notifications`).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSError", "NSObject", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSResponder"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotification", "UNNotificationRequest", "UNNotificationContent", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Files tab: scripted checks (tree, viewers, edit and save, search, go to file,
# media) and measurements (typing, tree scroll, memory). Usage: files-check <out-dir> [checks|perf|all]
[[bin]]
name = "files-check"
path = "src/files_check.rs"
required-features = ["headless"]

# Drives the terminal against a local PTY and benchmarks it. Usage: terminal-check <pty|bench> <out-dir>
[[bin]]
name = "preview-check"
path = "src/preview_check.rs"
required-features = ["headless"]

# Drives the live scene against a real server: sidebar, thread switches, streaming, approve,
# queue, rename and pin, restart from cache, and measurements.
# Usage: live-check <seed|drive|restart|bench> <out-dir>  (T3_LIVE_DATA_DIR, T3_PAIRING_URL)
[[bin]]
name = "live-check"
path = "src/live_check.rs"
required-features = ["headless"]
