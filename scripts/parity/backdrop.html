<!doctype html>
<!-- The renderer's backdrop blur comparison scene in HTML: apps/web/src/scenes/backdrop.rs. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 800px; height: 500px; overflow: hidden; background: #202020; }
  div { position: absolute; box-sizing: border-box; }
</style>
<body>
<script>
  const palette = ["#e04040", "#40c040", "#4060e0", "#e0c040", "#f0f0f0", "#202020"];
  const add = (style) => document.body.appendChild(Object.assign(document.createElement("div"), { style }));
  for (let column = 0; column < 20; column++)
    for (let row = 0; row < 13; row++)
      add(`left:${column * 40}px;top:${row * 40}px;width:40px;height:40px;background:${palette[(column * 7 + row * 3) % 6]}`);
  const panels = [
    [60, 60, 300, 200, 12, 16, 1.08, "rgb(0 0 0 / 0)"],
    [420, 60, 300, 200, 8, 12, 1.14, "rgb(24 24 27 / 0.4)"],
    [60, 300, 300, 150, 16, 16, 1.08, "rgb(0 0 0 / 0.4)"],
    [420, 300, 300, 150, 0, 4, 1, "rgb(10 10 10 / 0.64)"],
    [740, 430, 120, 120, 10, 16, 1.08, "rgb(255 255 255 / 0.1)"],
  ];
  for (const [x, y, w, h, r, blur, saturation, fill] of panels)
    add(`left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${r}px;background:${fill};backdrop-filter:blur(${blur}px) saturate(${saturation})`);
  add("left:320px;top:280px;width:80px;height:80px;background:#ff00ff");
</script>
