name: Personal desktop builds

# Builds unsigned desktop apps for personal machines.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tools_only:
        description: Build only the macOS headless tools (for parity runs on a branch)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: personal-builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # The app compiles its Metal shaders at launch; the build checks them
      # with the Metal compiler, which Xcode 26 installs separately.
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "::warning::Metal toolchain not installed; shaders are checked at launch only"

      - name: Build app
        if: ${{ !inputs.tools_only }}
        run: cargo build --release --locked -p t3code-desktop --bin t3code

      - name: Bundle and ad hoc sign
        if: ${{ !inputs.tools_only }}
        shell: bash
        run: |
          set -euo pipefail
          app="T3 Code GPUI.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/t3code "$app/Contents/MacOS/t3code"
          version="$(cargo pkgid -p t3code-desktop | sed 's/.*[#@]//')"
          sed "s/__VERSION__/$version/g" apps/desktop/resources/Info.plist > "$app/Contents/Info.plist"
          iconset="$RUNNER_TEMP/AppIcon.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/prod/black-macos-1024.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" assets/prod/black-macos-1024.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --keepParent "$app" T3-Code-GPUI-mac-arm64.zip

      - name: Upload app
        if: ${{ !inputs.tools_only }}
        uses: actions/upload-artifact@v7
        with:
          name: t3code-gpui-mac-arm64
          path: T3-Code-GPUI-mac-arm64.zip
          retention-days: 14

      # The headless tools, to render through CoreText (SF Pro, Monaco, PT Mono)
      # and Metal on a real Mac: shot <scene> <out.png>, parity-shot <out-dir>,
      # app-check <mode> ..., motion-check <out-dir>, plus the parity scripts.
      - name: Build headless tools
        run: >
          cargo build --release --locked --features headless -p t3code-desktop
          --bin shot --bin parity-shot --bin app-check --bin motion-check

      - name: Package headless tools
        shell: bash
        run: |
          set -euo pipefail
          dir=t3code-gpui-tools-mac-arm64
          mkdir -p "$dir/bin"
          for bin in shot parity-shot app-check motion-check; do
            cp "target/release/$bin" "$dir/bin/"
          done
          codesign --force --sign - "$dir"/bin/*
          cp -R scripts/parity "$dir/parity"
          tar -czf "$dir.tar.gz" "$dir"

      - name: Upload headless tools
        uses: actions/upload-artifact@v7
        with:
          name: t3code-gpui-tools-mac-arm64
          path: t3code-gpui-tools-mac-arm64.tar.gz
          retention-days: 14

  windows:
    if: ${{ !inputs.tools_only }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Build app
        run: cargo build --release --locked -p t3code-desktop --bin t3code

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: t3code-gpui-windows-x64
          path: target/release/t3code.exe
          retention-days: 14
