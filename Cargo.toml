# Mirrors the T3 Code monorepo layout: apps/web is the UI, apps/desktop is the
# native shell around it, packages/* hold contracts, shared helpers, and the
# connection/sync runtime.
[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "apps/web",
    "packages/client-runtime",
    "packages/contracts",
    "packages/shared",
]

[workspace.package]
version = "0.1.11"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
t3code-client-runtime = { path = "packages/client-runtime" }
t3code-contracts = { path = "packages/contracts" }
t3code-shared = { path = "packages/shared" }
t3code-web = { path = "apps/web" }

# gpui-kit pins gpui-pre (a crates.io snapshot of Zed's gpui) and re-exports
# gpui, gpui-component, and the Lucide icon assets. Pin exactly: gpui-pre
# changes API weekly.
gpui-kit = { version = "=0.11.0", features = ["syntect"] }

anyhow = "1"
base64 = "0.22"
futures = "0.3"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Dependencies carry no debuginfo, and only the hot rendering and layout crates
# are optimized, so debug builds stay small and scroll at a usable frame rate.
[profile.dev.package."*"]
debug = false

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
ropey = { opt-level = 3 }
markdown = { opt-level = 3 }

[profile.release]
debug = false
strip = "symbols"
codegen-units = 16
lto = "thin"
