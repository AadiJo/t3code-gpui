# Mirrors the T3 Code monorepo layout: apps/web is the UI, apps/desktop is the
# native shell around it, packages/* hold contracts, shared helpers, and the
# connection/sync runtime.
[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "apps/web",
    "packages/client-runtime",
    "packages/contracts",
    "packages/i18n-macros",
    "packages/shared",
]

[workspace.package]
version = "0.1.11"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
t3code-client-runtime = { path = "packages/client-runtime" }
t3code-contracts = { path = "packages/contracts" }
t3code-i18n-macros = { path = "packages/i18n-macros" }
t3code-shared = { path = "packages/shared" }
t3code-web = { path = "apps/web" }

# gpui-kit pins gpui-pre (a crates.io snapshot of Zed's gpui) and re-exports
# gpui, gpui-component, and the Lucide icon assets. Pin exactly: gpui-pre
# changes API weekly.
gpui-kit = { version = "=0.11.0", features = ["syntect"] }

alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1"
base64 = "0.22"
dirs = "6"
futures = "0.3"
fancy-regex = "0.16"
image = { version = "0.25", default-features = false }
zune-jpeg = "0.5"
zune-core = "0.5"
rust-embed = "8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
flate2 = "1"
jiff = "1"
proc-macro2 = "1"
quote = "1"
sha2 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
syn = { version = "2", features = ["full"] }
sys-locale = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
tracing = "0.1"
url = { version = "2", features = ["serde"] }
keyring = "4.2"
rand = "0.9"
resvg = { version = "0.46", default-features = false, features = ["text"] }
rodio = { version = "0.21", default-features = false, features = ["playback", "mp3"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider", "http2"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
webpki-roots = "1"
unicode-normalization = "0.1"
unicode-properties = "0.1"
icu_normalizer = "2"
uuid = { version = "1", features = ["v4"] }
smallvec = "1"
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
unicode-segmentation = "1"
markdown = "=1.0.0"
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
regex = "1"
unicode-width = "0.2"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
windows-sys = "0.61"
embed-resource = "3"

# No debuginfo: debug builds of this workspace are large, and panics still
# report their file and line.
[profile.dev]
debug = false

# Dependencies carry no debuginfo, and only the hot rendering and layout crates
# are optimized, so debug builds stay small and scroll at a usable frame rate.
[profile.dev.package."*"]
debug = false

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
ropey = { opt-level = 3 }
markdown = { opt-level = 3 }
alacritty_terminal = { opt-level = 3 }
vte = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
harfrust = { opt-level = 3 }
skrifa = { opt-level = 3 }
read-fonts = { opt-level = 3 }
font-types = { opt-level = 3 }
swash = { opt-level = 3 }
yazi = { opt-level = 3 }
zeno = { opt-level = 3 }
fontdb = { opt-level = 3 }
unicode-linebreak = { opt-level = 3 }
unicode-bidi = { opt-level = 3 }
gpui-pre-wgpu = { opt-level = 3 }
gpui-pre-linux = { opt-level = 3 }
syntect = { opt-level = 3 }
fancy-regex = { opt-level = 3 }
regex-automata = { opt-level = 3 }
regex-syntax = { opt-level = 3 }
unicode-segmentation = { opt-level = 3 }
flate2 = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
bincode = { opt-level = 3 }
# The streamed preview decodes a JPEG per frame.
zune-jpeg = { opt-level = 3 }
zune-core = { opt-level = 3 }
image = { opt-level = 3 }

[profile.release]
debug = false
strip = "symbols"
codegen-units = 16
lto = "thin"
